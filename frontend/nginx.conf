server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Redirection automatique des requêtes API vers le conteneur backend
    location /api/ {
        proxy_pass http://backend:5000/; # Nom du service backend dans docker-compose + son port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}