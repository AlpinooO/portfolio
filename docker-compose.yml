services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
    expose:
      - "5000"
    networks:
      - proxy-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true