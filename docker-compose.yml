version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: portfolio-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from leo-malgonne.fr,www.leo-malgonne.fr --to portfolio-frontend:80
    depends_on:
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config: